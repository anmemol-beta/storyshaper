<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>StoryShaper · 장면별 백업 이미지</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fbf7ee; color: #483c2d; font-family: system-ui, sans-serif; }
    header, main, footer { max-width: 1500px; margin: auto; padding: 24px; }
    header { padding-top: 40px; padding-bottom: 8px; }
    h1 { margin: 0 0 12px; font-size: clamp(24px, 3vw, 36px); letter-spacing: -.04em; }
    p { margin: 0; line-height: 1.7; color: #776b5c; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
    figure { margin: 0; overflow: hidden; background: #fffdf7; border: 1px solid #e7ddcc; border-radius: 16px; }
    figure a { display: block; }
    figure a:focus-visible { outline: 4px solid #725a32; outline-offset: -4px; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: contain; }
    figcaption { padding: 15px 17px 18px; }
    figcaption span { display: block; margin-bottom: 7px; color: #88755c; font-size: 12px; }
    figcaption strong { font-size: 15px; line-height: 1.5; }
    footer { padding-top: 0; font-size: 13px; color: #88755c; }
    @media (max-width: 1000px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 620px) { header, main, footer { padding-left: 16px; padding-right: 16px; } main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>장면별 백업 이미지</h1>
    <p>메인 장면을 제외한 9장입니다. 재료와 집 외관을 생략하고, 마지막은 건축 재료가 보이지 않는 실내 식탁으로 표현했습니다.<br>그림을 누르면 원본 크기로 볼 수 있습니다. 요청에서 중복된 3번은 각각 따로 표시했습니다.</p>
  </header>
  <main aria-label="장면별 이미지">
    <figure>
      <a href="house1_predict.jpg" aria-label="삽을 든 첫째와 다가오는 늑대 크게 보기">
        <img src="house1_predict.jpg" width="1536" height="1024" alt="첫째가 삽을 들고 늠름하게 서 있고, 늑대가 씩 웃으며 다가온다." decoding="async">
      </a>
      <figcaption><span>요청 2</span><strong>삽을 든 첫째와 다가오는 늑대</strong></figcaption>
    </figure>
    <figure>
      <a href="house1_reflect.jpg" aria-label="우는 첫째와 웃는 늑대 크게 보기">
        <img src="house1_reflect.jpg" width="1536" height="1024" alt="집이 사라진 뒤 첫째는 울고, 곁에 있는 늑대는 웃는다. 집의 흔적과 재료는 그리지 않는다." decoding="async">
      </a>
      <figcaption><span>요청 3 (첫 번째)</span><strong>우는 첫째와 웃는 늑대</strong></figcaption>
    </figure>
    <figure>
      <a href="house2_choose.jpg" aria-label="궁금해하는 둘째와 달려오는 첫째 크게 보기">
        <img src="house2_choose.jpg" width="1536" height="1024" alt="파란 모자를 쓴 둘째가 물음표와 함께 궁금해하고, 첫째가 달려온다." decoding="async">
      </a>
      <figcaption><span>요청 3 (두 번째)</span><strong>궁금해하는 둘째와 달려오는 첫째</strong></figcaption>
    </figure>
    <figure>
      <a href="house2_predict.jpg" aria-label="망치를 든 둘째와 다가오는 늑대 크게 보기">
        <img src="house2_predict.jpg" width="1536" height="1024" alt="2번과 같은 구도에서 둘째가 망치를 들고 늠름하게 서 있고, 늑대가 씩 웃으며 다가온다." decoding="async">
      </a>
      <figcaption><span>요청 4</span><strong>망치를 든 둘째와 다가오는 늑대</strong></figcaption>
    </figure>
    <figure>
      <a href="house2_reflect.jpg" aria-label="손잡고 달아나는 형제와 거들먹거리는 늑대 크게 보기">
        <img src="house2_reflect.jpg" width="1536" height="1024" alt="둘째는 울고, 놀란 첫째가 둘째 손을 잡고 도망간다. 늑대는 팔짱을 끼고 거들먹거린다." decoding="async">
      </a>
      <figcaption><span>요청 5</span><strong>손잡고 달아나는 형제와 거들먹거리는 늑대</strong></figcaption>
    </figure>
    <figure>
      <a href="house3_choose.jpg" aria-label="삽·망치를 든 형제들과 고민하는 막내 크게 보기">
        <img src="house3_choose.jpg" width="1536" height="1024" alt="첫째는 삽, 둘째는 망치를 들고, 빨간 스카프의 셋째는 물음표와 함께 고민한다." decoding="async">
      </a>
      <figcaption><span>요청 6</span><strong>삽·망치를 든 형제들과 고민하는 막내</strong></figcaption>
    </figure>
    <figure>
      <a href="house3_predict.jpg" aria-label="왼쪽 늑대와 오른쪽의 자신만만한 삼형제 크게 보기">
        <img src="house3_predict.jpg" width="1536" height="1024" alt="나쁜 표정의 늑대는 왼쪽, 기고만장한 삼형제는 오른쪽에 서서 서로 마주 본다." decoding="async">
      </a>
      <figcaption><span>요청 7</span><strong>왼쪽 늑대와 오른쪽의 자신만만한 삼형제</strong></figcaption>
    </figure>
    <figure>
      <a href="house3_reflect.jpg" aria-label="좌절한 늑대와 어깨동무하는 삼형제 크게 보기">
        <img src="house3_reflect.jpg" width="1536" height="1024" alt="늑대는 왼쪽 구석에서 좌절하고, 삼형제는 서로 웃으며 어깨동무한다." decoding="async">
      </a>
      <figcaption><span>요청 8</span><strong>좌절한 늑대와 어깨동무하는 삼형제</strong></figcaption>
    </figure>
    <figure>
      <a href="ending.jpg" aria-label="실내 식탁에서 대화하는 삼형제 크게 보기">
        <img src="ending.jpg" width="1536" height="1024" alt="삼형제가 집 안 식탁에 앉아 웃으며 서로 대화한다. 실내 분위기만 남기고 건축 재료·외관은 드러내지 않는다." decoding="async">
      </a>
      <figcaption><span>요청 9</span><strong>실내 식탁에서 대화하는 삼형제</strong></figcaption>
    </figure>
  </main>
  <footer>StoryShaper · 2026-11-02 · 수채화 그림책 · 1536 × 1024</footer>
</body>
</html>
