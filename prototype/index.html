<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StoryShaper 프로토타입</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>StoryShaper 프로토타입</h1>
  <p>아기돼지 삼형제 첫째 집 장면 · 아이가 말로 답하면 그림이 바뀌는 흐름</p>
</header>

<div class="wrap">
  <div class="tablet">
    <div class="screen">
      <div class="art" id="art">
        <img id="imgOld" alt="짚으로 만든 집 앞에 서 있는 아기돼지" src="img/straw_house.jpg">
        <img id="imgNew" alt="종이로 접어 만든 집 앞에 서 있는 아기돼지" src="img/paper_house.jpg">
        <div class="brush" id="brush" hidden><span>그림 요정이 다시 그리는 중</span><span class="bar"><i></i></span></div>
        <div class="bubble" id="bubble" hidden></div>
        <div class="hints" id="hints" hidden></div>
      </div>
      <div class="text">
        <p class="line" id="line"></p>
        <button class="mic" id="mic" aria-label="꾹 누르고 말하기" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="next" id="next" type="button" hidden>다시 읽기 →</button>
      </div>
    </div>
  </div>

  <aside>
    <div class="panel">
      <h2>지금 이 순간</h2>
      <ol class="steps" id="steps"></ol>
    </div>
    <div class="panel">
      <h2>아이 대신 답하기</h2>
      <div class="answers" id="answers"></div>
      <p class="muted">태블릿의 초록 마이크를 꾹 누르면 첫 번째 답으로 말한 것으로 처리돼요.</p>
    </div>
    <div class="panel">
      <div class="row">
        <button class="btn" id="restart" type="button">처음부터</button>
        <label class="tog"><input type="checkbox" id="voice"> 읽어주기 소리 켜기</label>
      </div>
      <p class="muted">그림 다시 그리기는 실제로 12~20초 걸려요. 여기서는 5초로 줄였어요. 소리는 브라우저 기본 음성이라 실제 낭독과 다릅니다.</p>
    </div>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
