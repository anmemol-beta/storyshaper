<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF9EF">
<title>StoryShaper · 그림책</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="live-book.css">
</head>
<body class="reader-app">
<div class="shell">
<header class="bar">
  <div class="logo">✿ StoryShaper</div>
  <div class="tools">
    <label class="live-select"><span id="languageLabel">언어</span> <select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
    <label class="live-select"><span id="modeLabel">버전</span> <select id="mode"><option value="mock">오프라인 버전</option><option value="live">AI 버전</option></select></label>
    <button class="tool" id="settingsButton" type="button" aria-label="낭독 설정" aria-controls="readerSettings" aria-expanded="false">⚙</button>
    <a class="tool add-voice" id="addVoice" href="voice.html" hidden>🎙 부모 목소리 추가</a>
  </div>
</header>
<section class="reader-settings" id="readerSettings" hidden>
  <div class="setting-row"><strong id="readerName">읽어주는 목소리: 기본 목소리</strong> <a id="changeVoice" href="voice.html" target="_blank" rel="noopener">목소리 바꾸기</a></div>
  <label class="setting-row voice-select"><span id="voiceSelectLabel">저장된 목소리</span><select id="voiceSelect" disabled><option value="">기본 목소리</option></select></label>
  <p class="voice-select-status" id="voiceSelectStatus" role="status" aria-live="polite"></p>
  <label class="setting-row"><span id="readAloudLabel">소리 내어 읽기</span> <input type="checkbox" id="readAloud" checked></label>
</section>
<main class="book" id="book" data-state="COVER">
 <div class="art">
   <img id="imgCur" class="is-current" src="img/intro.jpg" alt="동화 그림">
   <img id="imgNext" src="img/intro.jpg" alt="" aria-hidden="true">
   <video id="storyVideo" class="live-video" muted playsinline hidden aria-label="움직이는 동화 그림"></video>
   <p id="pictureNotice" class="picture-notice" role="status" hidden></p>
   <nav class="page-navigation" id="pageNavigation" aria-label="장면 이동">
     <button id="previousPage" type="button" aria-label="이전 장면" title="이전 장면" disabled>◀</button>
     <button id="nextPage" type="button" aria-label="다음 장면" title="다음 장면" disabled>▶</button>
   </nav>
   <div class="narration-controls" role="group" aria-label="낭독 재생" id="narrationControls">
     <div><button id="playNarration" type="button" disabled>▶ 재생</button><button id="pauseNarration" type="button" disabled>Ⅱ 일시정지</button></div>
     <span id="narrationStatus" role="status" aria-live="polite"></span>
   </div>
   <div class="live-overlay" id="loading" role="status" aria-live="polite" hidden>
     <span id="loadingText">다음 그림을 그리고 있어요…</span>
     <button id="retryMedia" type="button" hidden>그림 다시 불러오기</button>
   </div>
 </div>
 <section class="text-panel">
   <button class="cover" id="cover" type="button"><span id="storyTitle">아기돼지 삼형제</span><small id="readBy">읽어주는 목소리: 기본 목소리</small><b id="startLabel">▶ 동화 시작</b></button>
   <div id="narrative" class="live-narrative" aria-live="polite"></div>
   <div id="question" class="live-question"></div>
   <div class="live-controls" id="freeInput" hidden>
     <label class="sr-only" for="answer">답변</label>
     <input id="answer" type="text" placeholder="답이나 생각을 적어 줘" autocomplete="off" disabled>
     <button id="send" type="button" disabled>답하기</button>
   </div>
   <div class="mic-col" id="inputActions" hidden>
     <button class="camera-button" id="cameraButton" type="button" hidden>📷 물건 보여주기</button>
     <button class="mic" id="mic" type="button" disabled aria-label="말로 답하기">🎙</button>
   </div>
   <div class="camera-panel" id="cameraPanel" hidden>
     <video id="cameraPreview" muted playsinline aria-label="카메라 미리보기"></video>
     <div><button id="cameraSnap" type="button">사진 찍기</button><button id="cameraCancel" type="button">닫기</button></div>
   </div>
   <div class="live-choices" id="choices" hidden></div>
   <p class="status" id="status" role="status" aria-live="polite"></p>
 </section>
</main>
<footer class="foot"><div id="progress" role="status"></div><button id="restart" class="btn" type="button">↻ 처음부터</button></footer>
</div>
<script src="image-transitions.js"></script>
<script src="story-media.js"></script>
<script src="voice-input.js"></script>
<script src="camera-input.js"></script>
<script src="story-motion.js"></script>
<script src="narration.js"></script>
<script src="live-book.js"></script>
</body></html>
