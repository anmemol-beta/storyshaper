<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF9EF">
<title>StoryShaper · Live Book</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="live-book.css">
</head>
<body>
<div class="shell">
<header class="bar">
  <div class="logo">✿ StoryShaper <small>Live</small></div>
  <div class="tools">
    <label class="live-select">Story <select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
    <label class="live-select">Mode <select id="mode"><option value="mock">Demo</option><option value="live">AI</option></select></label>
    <button class="tool" id="settingsButton" type="button" aria-label="Reader settings">⚙</button>
    <a class="tool live-home" href="index.html" aria-label="Fixed demo">⌂</a>
  </div>
</header>
<section class="reader-settings" id="readerSettings" hidden>
  <div class="setting-row"><strong id="readerName">Reader: Default reader</strong> <a id="changeVoice" href="voice.html" target="_blank" rel="noopener">Change</a></div>
  <label class="setting-row">Read aloud <input type="checkbox" id="readAloud" checked></label>
  <p class="reader-help">Voice registration and audio generation belong to the narration module. This screen only selects a reader and calls its public interface.</p>
</section>
<main class="book" id="book" data-state="COVER">
 <div class="art"><img id="imgCur" class="is-current" src="img/intro.jpg" alt="Story illustration"><img id="imgNext" src="img/intro.jpg" alt=""><video id="storyVideo" class="live-video" muted playsinline hidden aria-label="Animated story scene"></video><div class="live-overlay" id="loading" hidden>✦ <span id="loadingText">Updating story…</span></div></div>
 <section class="text-panel">
   <button class="cover" id="cover" type="button"><span id="storyTitle">아기돼지 삼형제</span><small id="readBy">Read by Default reader</small><b>▶ Start</b></button>
   <div id="narrative" class="live-narrative" aria-live="polite"></div>
   <div id="question" class="live-question"></div>
   <div class="mic-col">
     <div class="live-controls"><label class="sr-only" for="answer">Your answer</label><input id="answer" type="text" placeholder="답변 또는 아이디어 입력" autocomplete="off"><button id="send" type="button">Send</button></div>
     <button class="mic" id="mic" type="button" disabled aria-label="Record answer">🎙</button>
     <p class="status" id="status" role="status" aria-live="polite"></p>
   </div>
   <div class="live-choices" id="choices" hidden></div>
 </section>
</main>
<footer class="foot"><div id="progress" role="status">Ready</div><button id="restart" class="btn" type="button">↻ Restart</button></footer>
</div>
<script src="image-transitions.js"></script>
<script src="voice-input.js"></script>
<script src="narration.js"></script>
<script src="live-book.js"></script>
</body></html>
