<head>

<title>StoryShaper · 연결 필요</title>
<style>
  :root { font: 18px/1.5 system-ui, sans-serif; color: #fff9ef; background: #20313a; }
  body { min-height: 100svh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; text-align: center; }
  main { max-width: 26rem; }
  h1 { font-size: clamp(28px, 5vw, 42px); }
  button { min-height: 52px; padding: 12px 24px; border: 0; border-radius: 12px; background: #8bd1bb; color: #20313a; font: inherit; font-weight: 700; }
</style>
</head>
<body><main><h1>StoryShaper</h1><p>동화 서비스에 연결할 수 없어요. 연결을 확인한 뒤 다시 시도해 주세요.</p><button type="button" onclick="location.reload()">다시 연결</button></main></body>
</html>
